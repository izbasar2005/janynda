version: "3.8"

services:
  db:
    image: postgres:16
    container_name: janymda_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: janymda
    ports:
      - "5432:5432"
    volumes:
      - janymda_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: janymda_backend_dev
    depends_on:
      - db
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: janymda
      # Required; do not commit real values. Set in shell or a local .env file.
      JWT_SECRET: "${JWT_SECRET:-janynda-super-secret-key-2025-diploma-project-ok}"
      AUTO_SEED: "true"
      # Claude (Anthropic) API key for diary psychological assessment.
      # IMPORTANT: do not hardcode secrets in git. Provide via environment variable:
      #   set ANTHROPIC_API_KEY=... before running docker compose.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-5}"
      # SMSC.kz SMS service credentials
      SMSC_LOGIN: "${SMSC_LOGIN}"
      SMSC_PASSWORD: "${SMSC_PASSWORD}"
      # Gmail SMTP for email verification
      SMTP_EMAIL: "${SMTP_EMAIL}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      # Cloudinary (optional, for cloud image storage)
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY}"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./static/uploads:/app/static/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: janymda_frontend_dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_PROXY_TARGET: "http://api:8080"
      VITE_TURNSTILE_SITE_KEY: "0x4AAAAAADj_iE0yMQFExt6Y"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

volumes:
  janymda_pg: